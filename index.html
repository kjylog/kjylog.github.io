<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kjylog — 공사중</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }
    .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(250, 204, 21, 0.16);
      color: #fde047;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    p {
      color: #cbd5e1;
      line-height: 1.6;
      font-size: 15px;
    }
    .footer {
      margin-top: 28px;
      font-size: 13px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">🚧</div>
    <span class="badge">Under Construction</span>
    <h1>페이지 공사중입니다</h1>
    <p>
      새로운 페이지와 프로젝트들을<br />
      준비하고 있습니다. 곧 찾아뵐게요!
    </p>
    <div class="footer">kjylog.github.io</div>
  </main>
</body>
</html>
