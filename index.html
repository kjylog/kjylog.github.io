<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>kjylog — Pages Index</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      padding: 36px 20px 56px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: linear-gradient(160deg, #0f172a 0%, #1e293b 100%);
      color: #f8fafc;
    }
    .wrap {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.16);
      color: #7dd3fc;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .subtitle {
      color: #94a3b8;
      font-size: 14px;
    }
    .search {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 20px;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: #f8fafc;
      font-size: 15px;
      outline: none;
    }
    .search::placeholder { color: #64748b; }
    .search:focus { border-color: #38bdf8; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }
    .card {
      display: block;
      text-decoration: none;
      color: inherit;
      padding: 18px 20px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: transform 0.14s ease, border-color 0.15s ease, background 0.15s ease;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(56, 189, 248, 0.6);
      background: rgba(255, 255, 255, 0.1);
    }
    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .slug {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      color: #7dd3fc;
    }
    .arrow {
      color: #64748b;
      font-size: 14px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.4;
      word-break: keep-all;
    }
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 20px;
      color: #94a3b8;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px dashed rgba(255, 255, 255, 0.14);
    }
    footer {
      margin-top: 32px;
      text-align: center;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="badge">kjylog.github.io · 총 </span>
      <h1>공유 페이지 모음</h1>
      <p class="subtitle">하위 폴더에 배포된 페이지 인덱스입니다.</p>
    </header>
    <input class="search" id="search" type="search" placeholder="페이지 이름 또는 경로 검색..." autocomplete="off" />
    <main class="grid" id="grid">
      <a class="card" href="./hello/" data-search="hello world — kjylog.github.io hello">
        <div class="card-top">
          <span class="slug">/hello/</span>
          <span class="arrow">↗</span>
        </div>
        <div class="card-title">Hello World — kjylog.github.io</div>
      </a>
      <a class="card" href="./interior/" data-search="인테리어 항목 — 시공 요청서 interior">
        <div class="card-top">
          <span class="slug">/interior/</span>
          <span class="arrow">↗</span>
        </div>
        <div class="card-title">인테리어 항목 — 시공 요청서</div>
      </a>
    </main>
    <footer>Last updated: 2026-11-22 00:00</footer>
  </div>
  <script>
    const input = document.getElementById('search');
    const cards = Array.from(document.querySelectorAll('.card'));
    input.addEventListener('input', () => {
      const q = input.value.trim().toLowerCase();
      cards.forEach((c) => {
        const text = c.dataset.search || '';
        c.style.display = text.includes(q) ? '' : 'none';
      });
    });
  </script>
</body>
</html>
