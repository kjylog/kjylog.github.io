<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World — kjylog.github.io</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #312e81 100%);
      color: #f8fafc;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.18);
      color: #7dd3fc;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    p {
      color: #cbd5e1;
      line-height: 1.6;
      font-size: 15px;
      margin-bottom: 24px;
    }
    button {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 14px;
      background: #38bdf8;
      color: #0f172a;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.12s ease, background 0.15s ease;
    }
    button:active { transform: scale(0.98); }
    button:hover { background: #7dd3fc; }
    .meta {
      margin-top: 20px;
      font-size: 13px;
      color: #94a3b8;
    }
    .back {
      display: inline-block;
      margin-top: 14px;
      font-size: 13px;
      color: #7dd3fc;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">share-page skill</span>
    <h1>Hello, World! 👋</h1>
    <p>
      <code>share-page</code> 스킬로 생성하고<br />
      <code>kjylog.github.io/hello</code>에 자동 배포한 페이지입니다.
    </p>
    <button id="btn">눌러서 반응 확인하기</button>
    <div class="meta" id="status">버튼 클릭 횟수: 0</div>
    <a class="back" href="/">← kjylog.github.io 메인으로</a>
  </main>
  <script>
    let count = 0;
    const btn = document.getElementById('btn');
    const status = document.getElementById('status');
    btn.addEventListener('click', () => {
      count += 1;
      status.textContent = `버튼 클릭 횟수: ${count} 🎉`;
    });
  </script>
</body>
</html>
